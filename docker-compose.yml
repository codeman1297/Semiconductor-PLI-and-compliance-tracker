services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tracker:tracker@postgres:5432/tracker
      CORS_ORIGINS: http://localhost:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment: {API_URL: http://backend:8000, NEXT_PUBLIC_API_URL: http://localhost:8000}
    depends_on: [backend]
    ports: ["3000:3000"]
volumes: {postgres_data: {}}
